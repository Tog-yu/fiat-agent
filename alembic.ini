# Alembic configuration (phase B1, DEV_SPEC B1).
# Run from repo root: `alembic upgrade head`.
[alembic]
script_location = migrations
prepend_sys_path = .
# sqlalchemy.url is intentionally empty; env.py resolves it from
# settings / DATABASE_URL so production and tests share one path.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
