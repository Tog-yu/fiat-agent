[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiat-agent"
version = "0.1.0"
description = "法币业务内部使用的定制 Agent 系统 (fiat-agent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # A1 skeleton only pins pydantic as the shared base.
    # A3 adds PyYAML for settings loading (DEV_SPEC §3.1 / §8). The full stack
    # is added incrementally per DEV_SPEC section 3.1.
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Phase B1: async DB layer (SQLAlchemy 2.0) + Alembic migrations.
    # Current default is SQLite via aiosqlite (zero external service, low cost).
    # PostgreSQL is an extension point — pull it in with `pip install ".[postgres]"`.
    # greenlet is required by SQLAlchemy's async extension.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    # Phase B7: API layer (FastAPI) + TestClient (httpx).
    "fastapi>=0.110",
    "httpx>=0.27",
    # Phase D2: OpenAI-compatible provider (covers OpenAI / DeepSeek / private relays).
    "openai==2.52.0",
    # Phase E1: MCP stdio client for the modular RAG MCP server (DEV_SPEC §3.1 pins
    # the latest v1 line; mcp 2.x is a breaking major not yet adopted by the RAG server).
    "mcp==1.28.1",
    # Phase G8: LangGraph orchestrates the agent loop (classify -> plan -> tool ->
    # approval -> final). DEV_SPEC §2.3 mandates LangGraph for the Agent Loop.
    "langgraph>=1.0",
    # Phase H5: parse rebate spreadsheets (.xlsx). CSV needs no extra dep.
    "openpyxl>=3.1",
]

# Optional extras — keep the base install lean.
# `postgres`: enable the PostgreSQL extension point (set FIAT_DB_URL + install this).
[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
# Test extras — kept separate so production installs stay lean (DEV_SPEC §9).
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fiat_agent*", "apps*"]

[tool.pytest.ini_options]
# A2: shared test base (conftest fixtures + markers). Tests run from the repo
# root; `pythonpath = ["."]` keeps `fiat_agent` / `apps` importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra"]  # report skipped/xfailed so markers are visible at a glance
markers = [
    "unit: 单元测试 (单模块逻辑)",
    "integration: 集成测试 (模块协作)",
    "e2e: 端到端测试 (完整业务链路)",
]
