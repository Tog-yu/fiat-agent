[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiat-agent"
version = "0.1.0"
description = "法币业务内部使用的定制 Agent 系统 (fiat-agent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # A1 skeleton only pins pydantic as the shared base.
    # A3 adds PyYAML for settings loading (DEV_SPEC §3.1 / §8). The full stack
    # is added incrementally per DEV_SPEC section 3.1.
    "pydantic>=2.6",
    "pyyaml>=6.0",
    # Phase B1: async DB layer (SQLAlchemy 2.0) + Alembic migrations.
    # Production uses PostgreSQL via asyncpg; tests use aiosqlite (no server).
    # greenlet is required by SQLAlchemy's async extension.
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["fiat_agent*", "apps*"]

[tool.pytest.ini_options]
# A2: shared test base (conftest fixtures + markers). Tests run from the repo
# root; `pythonpath = ["."]` keeps `fiat_agent` / `apps` importable.
pythonpath = ["."]
testpaths = ["tests"]
addopts = ["-ra"]  # report skipped/xfailed so markers are visible at a glance
markers = [
    "unit: 单元测试 (单模块逻辑)",
    "integration: 集成测试 (模块协作)",
    "e2e: 端到端测试 (完整业务链路)",
]
